<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Brick Slide – Pitch Deck | Hani Games</title>
<link rel="icon" type="image/png" href="../logo.png"/>
<link rel="shortcut icon" type="image/png" href="../logo.png"/>
<link rel="apple-touch-icon" href="../logo.png"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0a0f;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  #deck {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
  }

  .slide {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: transform;
  }

  .slide-inner {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide-inner img,
  .slide-inner video {
    height: 100dvh;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  #slide-video { pointer-events: auto; }

  #counter {
    position: fixed;
    top: 14px; right: 14px;
    z-index: 300;
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    color: rgba(255,255,255,0.7);
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 5px 13px;
    border-radius: 20px;
    pointer-events: none;
  }

  .nav-btn {
    position: fixed;
    top: 50%; z-index: 300;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.13);
    border: 1.5px solid rgba(255,255,255,0.22);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 50%;
    width: 50px; height: 50px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, opacity 0.25s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .nav-btn:hover  { background: rgba(245,130,13,0.55); border-color: rgba(245,130,13,0.8); }
  .nav-btn:active { background: rgba(245,130,13,0.75); }
  .nav-btn.hidden { opacity: 0; pointer-events: none; }
  #btn-prev { left: 14px; }
  #btn-next { right: 14px; }
  .nav-btn svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }



  #dots {
    position: fixed;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    z-index: 300;
    display: flex; gap: 9px; align-items: center;
  }
  .dot {
    height: 7px; width: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.28);
    border: 1.5px solid rgba(255,255,255,0.38);
    cursor: pointer;
    transition: background 0.25s, width 0.25s, border-color 0.25s, border-radius 0.25s;
  }
  .dot.active {
    background: #f5820d; border-color: #f5820d;
    width: 22px; border-radius: 4px;
  }

  #video-hint {
    position: fixed;
    bottom: 50px; left: 50%;
    transform: translateX(-50%);
    z-index: 300;
    color: rgba(255,255,255,0.6);
    font-size: 11px; font-weight: 600; letter-spacing: 0.8px;
    display: none;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 5px 13px;
    border-radius: 20px;
    pointer-events: none;
  }

  /* Hand — positioned, opacity+transform driven purely by JS RAF */
  #swipe-hint {
    position: fixed;
    top: 50%; right: 12%;
    z-index: 400;
    pointer-events: none;
    opacity: 0;
    /* no CSS animation here at all */
  }
  #swipe-hint img {
    width: 68px;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,0.55));
    display: block;
  }
</style>
</head>
<body>

<div id="counter">1 / 4</div>
<div id="video-hint">Tap to play / pause</div>
<div id="swipe-hint"><img src="tutorial_hand_3.png" alt=""/></div>

<div id="deck">
  <div class="slide" data-index="0">
    <div class="slide-inner">
      <img src="slide1.jpg" alt="Brick Slide Cover" draggable="false" id="slide1-img"/>
    </div>
  </div>
  <div class="slide" data-index="1">
    <div class="slide-inner">
      <video src="slide2.mp4" id="slide-video" loop muted playsinline preload="auto"></video>
    </div>
  </div>
  <div class="slide" data-index="2">
    <div class="slide-inner">
      <img src="slide3.jpg" alt="LiveOps & Monetization" draggable="false"/>
    </div>
  </div>
  <div class="slide" data-index="3">
    <div class="slide-inner">
      <img src="slide4.jpg" alt="Team & Contact" draggable="false"/>
    </div>
  </div>
</div>

<button class="nav-btn hidden" id="btn-prev" aria-label="Previous">
  <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
</button>
<button class="nav-btn" id="btn-next" aria-label="Next">
  <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
</button>

<div id="dots">
  <div class="dot active" data-i="0"></div>
  <div class="dot" data-i="1"></div>
  <div class="dot" data-i="2"></div>
  <div class="dot" data-i="3"></div>
</div>

<script>
  const TOTAL = 4;
  const DUR   = 360;
  let current = 0;
  let busy    = false;

  const slides  = Array.from(document.querySelectorAll('.slide'));
  const dots    = document.querySelectorAll('.dot');
  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  const counter = document.getElementById('counter');
  const videoEl = document.getElementById('slide-video');
  const hint    = document.getElementById('video-hint');
  const hand    = document.getElementById('swipe-hint');
  const slide1  = document.getElementById('slide1-img');

  /* ── slides ── */
  function positionAll(animated) {
    slides.forEach((s, i) => {
      s.style.transition = animated ? `transform ${DUR}ms cubic-bezier(0.35,0,0.15,1)` : 'none';
      s.style.transform  = `translateX(${(i - current) * 100}%)`;
    });
  }

  function goTo(index) {
    if (busy || index === current || index < 0 || index >= TOTAL) return;
    busy = true;
    if (current === 1) { videoEl.pause(); hint.style.display = 'none'; }
    current = index;
    positionAll(true);
    updateUI();
    if (current === 1) { videoEl.play().catch(() => {}); hint.style.display = 'block'; }
    setTimeout(() => { slides.forEach(s => s.style.transition = 'none'); busy = false; }, DUR + 30);
  }

  function updateUI() {
    counter.textContent = `${current + 1} / ${TOTAL}`;
    dots.forEach((d, i) => d.classList.toggle('active', i === current));
    btnPrev.classList.toggle('hidden', current === 0);
    btnNext.classList.toggle('hidden', current === TOTAL - 1);
  }

  videoEl.addEventListener('click', () => { if (videoEl.paused) videoEl.play(); else videoEl.pause(); });
  btnPrev.addEventListener('click', () => { stopHand(); goTo(current - 1); });
  btnNext.addEventListener('click', () => { stopHand(); goTo(current + 1); });
  dots.forEach(d => d.addEventListener('click', () => goTo(parseInt(d.dataset.i))));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goTo(current - 1);
  });

  /* ── drag / swipe ── */
  let startX = 0, startY = 0, dragging = false, delta = 0;

  function dragStart(x, y) {
    startX = x; startY = y; dragging = true; delta = 0;
    slides.forEach(s => s.style.transition = 'none');
  }
  function dragMove(x) {
    if (!dragging) return;
    delta = x - startX;
    slides.forEach((s, i) => {
      s.style.transform = `translateX(${(i - current) * 100 + delta / window.innerWidth * 100}%)`;
    });
  }
  function dragEnd() {
    if (!dragging) return;
    dragging = false;
    const threshold = window.innerWidth * 0.18;
    if (delta < -threshold && current < TOTAL - 1) {
      stopHand();
      goTo(current + 1);
    } else if (delta > threshold && current > 0) {
      stopHand();
      goTo(current - 1);
    } else {
      positionAll(true);
      setTimeout(() => slides.forEach(s => s.style.transition = 'none'), DUR + 30);
    }
  }

  document.addEventListener('touchstart', e => dragStart(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dy = Math.abs(e.touches[0].clientY - startY);
    const dx = Math.abs(e.touches[0].clientX - startX);
    if (dy > dx * 1.3) { dragging = false; positionAll(false); return; }
    dragMove(e.touches[0].clientX);
  }, { passive: true });
  document.addEventListener('touchend', () => dragEnd());
  document.addEventListener('mousedown', e => dragStart(e.clientX, e.clientY));
  document.addEventListener('mousemove', e => { if (dragging) dragMove(e.clientX); });
  document.addEventListener('mouseup', () => dragEnd());

  /* ── TUTORIAL HAND — pure RAF loop ── */
  let handStopped  = false;
  let handRafId    = null;
  let loopStart    = null;

  const LOOP_MS    = 2000;  // total loop duration
  const TRAVEL_PX  = 100;   // how far hand moves left
  const PARALLAX   = 18;    // px slide1 drifts left in sync

  // easing helpers
  function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

  function handTick(ts) {
    if (handStopped) {
      hand.style.opacity    = '0';
      hand.style.transform  = 'translateY(-50%)';
      slide1.style.transform = '';
      return;
    }

    if (!loopStart) loopStart = ts;
    const t = ((ts - loopStart) % LOOP_MS) / LOOP_MS; // 0..1

    // Phases (fraction of loop):
    // 0.00-0.15 → fade in
    // 0.15-0.55 → hold then swipe left
    // 0.55-0.70 → fade out at left
    // 0.70-1.00 → invisible, reset

    let opacity = 0;
    let tx = 0; // hand translateX
    let px = 0; // slide1 parallax

    if (t < 0.15) {
      // fade in
      const p = t / 0.15;
      opacity = easeInOut(p);
      tx = 0; px = 0;
    } else if (t < 0.55) {
      // swipe left
      const p = (t - 0.15) / 0.40;
      opacity = 1;
      tx = -TRAVEL_PX * easeInOut(p);
      px = -PARALLAX  * easeInOut(p);
    } else if (t < 0.70) {
      // fade out
      const p = (t - 0.55) / 0.15;
      opacity = 1 - easeInOut(p);
      tx = -TRAVEL_PX;
      px = -PARALLAX;
    } else {
      // invisible gap before next loop
      opacity = 0; tx = 0; px = 0;
    }

    hand.style.opacity   = opacity;
    hand.style.transform = `translateY(-50%) translateX(${tx}px)`;
    if (current === 0) slide1.style.transform = `translateX(${px}px)`;

    handRafId = requestAnimationFrame(handTick);
  }

  function startHand() {
    if (handStopped) return;
    loopStart = null;
    handRafId = requestAnimationFrame(handTick);
  }

  function stopHand() {
    handStopped = true;
    if (handRafId) cancelAnimationFrame(handRafId);
    hand.style.opacity     = '0';
    hand.style.transform   = 'translateY(-50%)';
    slide1.style.transform = '';
  }

  // Start after 3s
  setTimeout(() => {
    if (current === 0 && !handStopped) startHand();
  }, 3000);

  /* ── init ── */
  positionAll(false);
  updateUI();
</script>
</body>
</html>
